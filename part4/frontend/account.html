<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Dashboard</title>
    <link rel="stylesheet" href="css/account.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">HBnB</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="add_place.html">Host a Place</a>
            <a href="#" id="logout-btn">Logout</a>
        </nav>
    </header>

    <div class="dashboard-wrapper">
        
        <aside class="sidebar">
            <h2>Dashboard</h2>
            <a href="#" id="tab-places" class="sidebar-link active">My Places</a>
            <a href="add_place.html" class="sidebar-link">Add New Place</a>
            <a href="#" id="tab-bookings" class="sidebar-link">My Bookings</a>
            <a href="#" id="delete-account-btn" class="sidebar-link sidebar-danger">Delete Account</a>
        </aside>

        
        <main class="main-content">
            <h1 class="section-title">My Hosted Places</h1>
            <section id="my-places-list" class="places-grid">
                
            </section>
            <h1 class="section-title" id="bookings-title" style="display:none; margin-top: 40px;">Booking History</h1>
            <section id="my-bookings-list" class="places-grid" style="display:none;">

            </section>
        </main>
    </div>

    
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 700px; max-height: 90vh; overflow-y: auto;">
            <h2><i class="fa-solid fa-pen-to-square"></i> Edit Place Details</h2>
            <form id="edit-place-form">
                <input type="hidden" id="edit-place-id">
                
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="edit-title" required>
                </div>
                
                
                <div id="edit-image-inputs-container" class="input-group">
                    <label>Place Images</label>
                    
                </div>
                <button type="button" id="edit-add-more-imgs-btn" class="btn-manage-amenities" style="width: 100%; margin-bottom: 15px;">
                    <i class="fa-solid fa-plus"></i> Add another image
                </button>

                <div class="input-group">
                    <label>Description</label>
                    <textarea id="edit-description" rows="4"></textarea>
                </div>
                
                <div class="input-group">
                    <label>Price per night ($)</label>
                    <input type="number" id="edit-price" step="0.01" required>
                </div>

                
                <div class="input-group" style="margin-top: 20px;">
                    <label>Amenities</label>
                    <div id="edit-amenities-selection-wrapper" class="amenities-wrapper">
                        
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="close-modal-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/scripts.js"></script>
</body>
</html>
