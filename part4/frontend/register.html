<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Create Account</title>
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">HBnB</a>
        <nav>
            <a href="login.html" class="btn-outline">Log In</a>
        </nav>
    </header>

    <main class="login-container">
        <!-- قسم الصورة -->
        <div class="login-image">
            <img src="imgs/img1.jpg" alt="Join HBnB">
        </div>
        
        <!-- قسم النموذج -->
        <div class="login-form-wrapper">
            <div class="form-content">
                <h1>Create an account</h1>
                <p class="subtitle">Join us to start hosting or booking places.</p>
                
                <form id="register-form">
                    <div class="name-group">
                        <div class="input-group">
                            <label for="first_name"><i class="fa-regular fa-user"></i> First Name</label>
                            <input type="text" id="first_name" placeholder="First" required>
                        </div>
                        <div class="input-group">
                            <label for="last_name">Last Name</label>
                            <input type="text" id="last_name" placeholder="Last" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="reg_email"><i class="fa-regular fa-envelope"></i> Email address</label>
                        <input type="email" id="reg_email" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="reg_password"><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" id="reg_password" placeholder="Create a password (min. 6 chars)" required minlength="6">
                    </div>
                    
                    <button type="submit" class="submit-btn">Sign Up</button>
                    
                    <p class="redirect-text">Already have an account? <a href="login.html">Log in here</a></p>
                </form>
            </div>
        </div>
    </main>

    <script src="js/scripts.js"></script>
</body>
</html>
