<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">HBnB</a>
        <nav>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-image">
            <img src="imgs/img1.jpg" alt="Luxury Retreat Property">
        </div>
        
        <div class="login-form-wrapper">
            <div class="form-content">
                <p style="font-size: 0.75rem; letter-spacing: 2px; color: #888; margin-bottom: 15px;">● WELCOME BACK</p>
                <h1>Log in to your account</h1>
                
                <form id="login-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="submit-btn">Login ↗</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/scripts.js"></script>
</body>
</html>
