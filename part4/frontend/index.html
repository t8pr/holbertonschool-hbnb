<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Memorable Stays</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo" style="display: flex; align-items: center;">
            <img src="imgs/logo.png" alt="HBnB Logo" style="height: 40px; width: auto; object-fit: contain;">
        </a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="add_place.html" id="add-place-link" style="display: none;">Host a Place</a>
            <a href="account.html" id="account-link" style="display: none;">My Account</a>
            <a href="login.html" id="login-link" class="btn-login">Login</a>
        </nav>
    </header>

    
    <section class="hero">
        <div class="hero-content">
            <h1>
                <span class="script-text">Memorable</span><br>
                Places for<br>
                moments <span class="script-text">Rich</span><br>
                in emotions
            </h1>
            <p>Book now and get the best prices</p>
        </div>

        <div class="hero-image-wrapper">
            <img src="imgs/img3.jpg" alt="Featured Resort Property">
        </div>
        
        
        <div class="booking-bar">
            <div class="booking-field">
                <label>Max Price</label>
                <select id="price-filter">
                    <option value="All">All Prices</option>
                    <option value="50">Up to $50</option>
                    <option value="100">Up to $100</option>
                    <option value="200">Up to $200</option>
                </select>
            </div>
        </div>
    </section>

    
    <main>
        <h2 class="section-title">Explore Available Places</h2>
        <section id="places-list" class="places-grid">
            
        </section>
    </main>
    <h2 class="section-title" style="margin-top: 40px;">What Our Guests Say</h2>
    <section id="featured-reviews" class="reviews-showcase">
        <p style="text-align: center; width: 100%; color: var(--text-muted);">Loading best experiences...</p>
    </section>
    <script src="js/scripts.js"></script>
    <script>
        const observer = new MutationObserver((mutations) => {
            const netlifyBadge = document.getElementById('nl-badge');
            if (netlifyBadge) {
                netlifyBadge.remove();
                observer.disconnect();
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });
    </script>
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 HBnB Evolution. All rights reserved.</p>
            <div class="social-links">
                <a href="#" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
