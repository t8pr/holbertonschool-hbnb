<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Add Review</title>
    <!-- استدعاء مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/add_review.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">HBnB</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="account.html" id="account-link" style="display: none;">My Account</a>
            <a href="login.html" id="login-link" class="btn-login">Login</a>
        </nav>
    </header>

    <main class="add-review-container">
        <div class="review-form-card">
            
            <div class="card-header">
                <div class="icon-circle">
                    <i class="fa-regular fa-star"></i>
                </div>
                <h1>Rate your stay</h1>
                <p>Share your experience to help others</p>
            </div>
            
            <form id="review-form" class="form">
                <div class="input-group">
                    <label for="review-rating"><i class="fa-solid fa-ranking-star"></i> Overall Rating</label>
                    <select id="review-rating" required>
                        <option value="" disabled selected>Select a rating (1-5)...</option>
                        <option value="5">5 - Excellent (Highly Recommend)</option>
                        <option value="4">4 - Very Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Terrible (Do Not Recommend)</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="review-text"><i class="fa-regular fa-comment-dots"></i> Your Review</label>
                    <textarea id="review-text" placeholder="What did you love about this place? Was the host welcoming?" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Submit Review</button>
                <a href="#" onclick="window.history.back(); return false;" class="cancel-link">Cancel and go back</a>
            </form>
        </div>
    </main>

    <script src="js/scripts.js"></script>
</body>
</html>
